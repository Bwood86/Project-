<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>De Grote Afteller 🍺🍔</title>
<meta name="description" content="Aftellen tot 27 november 2026: geen alcohol en geen fastfood.">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1020;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:20px}.card{width:min(520px,100%);background:#151c31;border:1px solid #2b3658;border-radius:28px;padding:28px;text-align:center;box-shadow:0 20px 60px #0008}.eyebrow{font-size:13px;letter-spacing:.16em;color:#aab4d0;font-weight:800}.icons{font-size:25px;margin-top:14px}.count{font-size:clamp(90px,28vw,150px);font-weight:950;line-height:.95;margin:25px 0 5px}.label{font-size:20px;font-weight:800;color:#b9c3dc}.bar{height:14px;background:#28314b;border-radius:99px;overflow:hidden;margin:28px 0 10px}.fill{height:100%;background:linear-gradient(90deg,#22c55e,#eab308);width:0}.stats{display:flex;justify-content:space-between;color:#aab4d0;font-size:12px}.rules{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:24px 0}.rule{background:#202943;border-radius:18px;padding:17px}.rule b{display:block;margin-top:7px}.rule small{color:#aab4d0}.msg{font-weight:800;font-size:18px;margin-top:10px}.date{color:#aab4d0;margin-top:9px;font-size:14px}.footer{margin-top:20px;font-size:11px;color:#697591}
</style>
</head>
<body>
<main class="card">
<div class="eyebrow">DE GROTE AFKICK-CHALLENGE 😂</div>
<div class="icons">🍺🚫 &nbsp; GEEN ALCOHOL &nbsp; • &nbsp; 🍔🚫 GEEN FASTFOOD</div>
<div id="count" class="count">67</div>
<div id="label" class="label">DAGEN TE GAAN</div>
<div class="bar"><div id="fill" class="fill"></div></div>
<div class="stats"><span>67 😭</span><span id="stats">Challenge gestart</span><span>0 🥳</span></div>
<section class="rules">
<div class="rule"><span style="font-size:34px">🍺🚫</span><b>BIER?</b><small>Mooi niet.</small></div>
<div class="rule"><span style="font-size:34px">🍔🚫</span><b>FASTFOOD?</b><small>Droom lekker verder.</small></div>
</section>
<div id="msg" class="msg">💪 Nog even doorbijten!</div>
<div class="date">🏁 Bevrijdingsdag: <b>27 november 2026</b></div>
<div class="footer">Elke dag automatisch één dag minder 😈</div>
</main>
<script>
const TOTAL=67, END=Date.UTC(2026,10,27);
function update(){
 const n=new Date(), today=Date.UTC(n.getFullYear(),n.getMonth(),n.getDate());
 let left=Math.ceil((END-today)/86400000); left=Math.max(0,Math.min(TOTAL,left));
 const done=TOTAL-left,p=Math.round(done/TOTAL*100);
 document.querySelector('#count').textContent=left;
 document.querySelector('#fill').style.width=p+'%';
 document.querySelector('#stats').textContent=done+' van 67 overleefd 😎';
 const msg=document.querySelector('#msg'),label=document.querySelector('#label');
 if(left===0){label.textContent='🎉 EINDELIJK! 🎉';msg.textContent='🍺🍔 HET MAG WEER! Geniet ervan! 🥳'}
 else if(left<=7)msg.textContent='🔥 Nog '+left+'! De finish is in zicht!';
 else if(left<=30)msg.textContent='😎 Nog '+left+' dagen. Dit begint ergens op te lijken.';
 else msg.textContent='💪 Nog '+left+' dagen volhouden. Geen smoesjes!';
}
update();
</script>
</body></html>
